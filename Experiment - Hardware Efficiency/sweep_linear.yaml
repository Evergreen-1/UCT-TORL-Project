program: linear-dt.py
project: Experiment-B
entity: TORL-team
method: bayes
metric:
  name: eval/5000.0_normalized_score_mean
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 5000
  eta: 2
run_cap: 25
command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - "--update_steps=30000"
  - "--eval_every=5000"
  - "--device=cuda"
  - "--weight_decay=1e-4"
  - "--clip_grad=0.25"
  - "--env_name=Walker2d-v5"
  - "--dataset_id=mujoco/walker2d/medium-v0"
  - "--checkpoints_path=./sweep_checkpoints"
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 3e-5
    max: 3e-4
  arch:
    values:
      - "embedding_dim=64,num_heads=1"
      - "embedding_dim=128,num_heads=2"
      - "embedding_dim=128,num_heads=4"
      - "embedding_dim=256,num_heads=4"
  num_layers:
    values: [2, 3, 4]
  seq_len:
    values: [10, 20]
  attention_dropout:
    values: [0.0, 0.1]
  residual_dropout:
    values: [0.0, 0.1]